<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#10152b"><title>NÉ GẤP! 0.4 — Bé Tia</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10152b;color:white;font-family:system-ui;touch-action:none}canvas{width:100vw;height:100dvh;display:block}#hud{position:fixed;inset:0;pointer-events:none;padding:18px 14px}.score{position:absolute;top:16px;left:50%;transform:translateX(-50%);text-align:center;font-weight:1000;font-size:52px;text-shadow:0 4px #0008}.score small{display:block;font-size:11px;letter-spacing:2px}.tools{position:absolute;right:12px;top:12px;pointer-events:auto}.tools button{background:#1b3155;color:white;border:1px solid #ffffff44;border-radius:12px;padding:10px}.brand{font-weight:1000;letter-spacing:2px;color:#bdefff}#panel{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(90vw,380px);padding:23px 20px;border-radius:25px;text-align:center;background:linear-gradient(145deg,#203963,#10182f);border:1px solid #ffffff44;box-shadow:0 20px 60px #0009}h1{margin:0;color:#ffe36e;font-size:48px;letter-spacing:-3px}#desc{font-size:14px;line-height:1.5;color:#dceaff}.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:12px 0}.mode{padding:10px 3px;border-radius:12px;border:1px solid #ffffff44;background:#ffffff0c;color:white;font-weight:900;font-size:12px}.mode small{display:block;font-size:10px;font-weight:500;margin-top:4px}.mode.active{background:#ffe36e;color:#17213a;border-color:#ffe36e}#start{width:100%;padding:15px;border:0;border-radius:14px;background:linear-gradient(#fff09b,#ffc84d);font-size:17px;font-weight:1000;color:#17213a;box-shadow:0 4px #a66c24}.note{font-size:11px;color:#b9cce9;line-height:1.5;margin-top:13px}.hidden{display:none!important}#hint{position:absolute;bottom:22px;width:100%;text-align:center;font-size:11px;letter-spacing:1px;color:#e2f4ffb0;left:0}#tutorial{position:absolute;top:90px;left:50%;transform:translateX(-50%);font-size:11px;background:#132e4ccc;border:1px solid #80eaff66;border-radius:30px;padding:7px 12px;white-space:nowrap;opacity:0}#combo{position:absolute;top:118px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:1000;letter-spacing:2px;color:#ffe36e;text-shadow:0 2px 8px #000;opacity:0;transition:opacity .15s}
</style></head><body><canvas id="c"></canvas><div id="hud"><div class="brand">NÉ GẤP!<br><small>ARCADE 0.4 • BÉ TIA</small></div><div class="score"><span id="score">0</span><small id="best">BEST 0</small></div><div class="tools"><button id="sound">♫</button> <button id="pause">Ⅱ</button></div><div id="tutorial">CHẠM 1 LẦN ĐỂ ĐỔI HƯỚNG</div><div id="combo">COMBO ×2</div><div id="panel"><h1 id="title">NÉ GẤP!</h1><div style="font-size:10px;letter-spacing:3px;color:#9cf9ed;font-weight:900">DODGE • FLIP • SURVIVE</div><p id="desc">Chạm màn hình để đổi trọng lực.<br>Né chướng ngại vật và thu thập xu!</p><b style="font-size:12px;color:#bddaff">CHỌN ĐỘ KHÓ</b><div class="modes"><button class="mode active" data-d="easy">DỄ<small>Người mới</small></button><button class="mode" data-d="normal">THƯỜNG<small>Cân bằng</small></button><button class="mode" data-d="hard">KHÓ<small>Phản xạ</small></button></div><button id="start">CHƠI NGAY</button><div class="note">Mẹo: Chạm một lần, đợi nhân vật đổi hướng rồi mới chạm tiếp. Đừng chạm liên tục!</div></div><div id="hint">CHẠM MÀN HÌNH ĐỂ ĐẢO TRỌNG LỰC</div></div>
<script>
(()=>{const c=document.getElementById('c'),x=c.getContext('2d'),$=id=>document.getElementById(id);let W,H,D,mode='ready',diff='easy',score=0,best=+(localStorage.neGapBest04||0),speed=2.4,frame=0,p,obs=[],coins=[],bits=[],stars=[],muted=false,audio=null,flips=0,last=0,combo=0,comboClock=0,worldTime=0;
const cfg={easy:{v:2.4,gap:.32,spawn:112,grav:.22,flip:4.2},normal:{v:3.2,gap:.27,spawn:96,grav:.29,flip:4.8},hard:{v:4.1,gap:.23,spawn:82,grav:.36,flip:5.2}};
$('best').textContent='BEST '+best;
function size(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0);stars=Array.from({length:54},()=>({x:Math.random()*W,y:Math.random()*H*.72,z:.25+Math.random()*.9,r:.5+Math.random()*1.5}))}addEventListener('resize',size);size();
function beep(f=500,d=.1){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();let o=audio.createOscillator(),g=audio.createGain();o.frequency.value=f;g.gain.value=.035;o.connect(g);g.connect(audio.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+d);o.stop(audio.currentTime+d)}catch(e){}}
$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'♫̸':'♫';if(!muted)beep()};
document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>{diff=b.dataset.d;document.querySelectorAll('.mode').forEach(a=>a.classList.toggle('active',a===b))});
function panel(title,desc,btn,fn){$('title').textContent=title;$('desc').innerHTML=desc;$('start').textContent=btn;$('start').onclick=fn;$('panel').classList.remove('hidden')}
function reset(){score=0;frame=0;flips=0;combo=0;comboClock=0;obs=[];coins=[];bits=[];speed=cfg[diff].v;p={x:W*.24,y:H*.72,r:17,side:1,vy:0,rot:0,trail:[]};$('score').textContent=0;$('combo').style.opacity=0}
function start(){beep(620);reset();mode='play';$('panel').classList.add('hidden');$('tutorial').style.opacity=1}
$('start').onclick=start;
function flip(){if(mode!=='play')return;p.side*=-1;p.vy=p.side*cfg[diff].flip;flips++;beep(440+flips%3*120);for(let i=0;i<11;i++)bits.push({x:p.x,y:p.y,vx:(Math.random()-.5)*5,vy:(Math.random()-.5)*5,l:24}) ;if(flips>=3)$('tutorial').style.opacity=0}
c.addEventListener('pointerdown',e=>{e.preventDefault();flip()});
$('pause').onclick=()=>{if(mode==='play'){mode='pause';panel('TẠM DỪNG','Bạn đang có <b>'+score+'</b> điểm.','TIẾP TỤC',()=>{mode='play';$('panel').classList.add('hidden')})}else if(mode==='pause'){$('panel').classList.add('hidden');mode='play'}};
function spawn(){let a=cfg[diff],gap=Math.max(138,H*a.gap),mid=H*.5+(Math.random()-.5)*H*.16;obs.push({x:W+30,w:32,top:mid-gap/2,bottom:mid+gap/2,passed:false});if(Math.random()<.8)coins.push({x:W+65,y:mid+(Math.random()-.5)*gap*.25,t:false,spin:0})}
function hitRect(cx,cy,r,rx,ry,rw,rh){let xx=Math.max(rx,Math.min(cx,rx+rw)),yy=Math.max(ry,Math.min(cy,ry+rh));return (cx-xx)**2+(cy-yy)**2<r*r}
function end(){mode='over';beep(120,.2);if(score>best){best=score;localStorage.neGapBest04=best}$('best').textContent='BEST '+best;panel('GAME OVER','Bạn đạt <b>'+score+'</b> điểm. '+(score===best?'🏆 Kỷ lục mới!':'Cố thêm một lần nữa nhé!'),'CHƠI LẠI',start)}
function round(a,b,w,h,r){x.beginPath();x.roundRect(a,b,w,Math.max(0,h),r);x.fill()}
function draw(t){worldTime=t||0;let g=x.createLinearGradient(0,0,0,H);g.addColorStop(0,'#102044');g.addColorStop(.48,'#18365e');g.addColorStop(1,'#070d20');x.fillStyle=g;x.fillRect(0,0,W,H);for(let s of stars){let sx=(s.x-worldTime*.012*s.z+W*2)%(W+4);x.globalAlpha=.25+s.z*.45;x.fillStyle='#d9f7ff';x.beginPath();x.arc(sx,s.y,s.r,0,Math.PI*2);x.fill()}x.globalAlpha=1;let hz=H*.54;x.fillStyle='#263d68';x.beginPath();x.moveTo(0,hz);x.lineTo(W,hz);x.lineTo(W,H);x.lineTo(0,H);x.fill();x.strokeStyle='#6b91bf55';for(let i=0;i<10;i++){let y=hz+(H-hz)*i*i/100;x.beginPath();x.moveTo(0,y);x.lineTo(W,y);x.stroke()}for(let i=-5;i<=5;i++){x.beginPath();x.moveTo(W/2+i*9,hz);x.lineTo(W/2+i*W*.22,H);x.stroke()}x.fillStyle='#5cf1df';x.shadowColor='#5cf1df';x.shadowBlur=16;x.fillRect(0,hz,W,2);x.shadowBlur=0;
for(let o of obs){let gr=x.createLinearGradient(o.x,0,o.x+o.w,0);gr.addColorStop(0,'#126d91');gr.addColorStop(.28,'#39d6c0');gr.addColorStop(.62,'#b0ffe5');gr.addColorStop(1,'#145b91');x.fillStyle=gr;x.shadowColor='#58f3d0';x.shadowBlur=17;round(o.x,0,o.w,o.top,8);round(o.x,o.bottom,o.w,H-o.bottom,8);x.shadowBlur=0;x.fillStyle='#d6fff2';round(o.x-4,o.top-9,o.w+8,9,4);round(o.x-4,o.bottom,o.w+8,9,4);x.fillStyle='#0b456b';x.fillRect(o.x+5,0,3,o.top-12);x.fillRect(o.x+5,o.bottom+12,3,H-o.bottom-12)}
for(let q of coins)if(!q.t){let pulse=1+Math.sin(worldTime*.008+q.spin)*.13;x.save();x.translate(q.x,q.y);x.scale(pulse,1);x.fillStyle='#ffdf65';x.shadowColor='#ffbd35';x.shadowBlur=19;x.beginPath();x.arc(0,0,10,0,Math.PI*2);x.fill();x.shadowBlur=0;x.strokeStyle='#fff4b0';x.lineWidth=2;x.stroke();x.fillStyle='#94601b';x.font='1000 12px sans-serif';x.textAlign='center';x.fillText('★',0,4);x.restore()}
for(let b of bits){x.globalAlpha=b.l/20;x.fillStyle='#ffe36e';x.fillRect(b.x,b.y,4,4)}x.globalAlpha=1;
if(p){drawBeTia(worldTime)}}
function drawBeTia(t){
 x.save();x.translate(p.x,p.y);x.rotate(p.rot);
 // soft energy aura and flight trail
 let aura=x.createRadialGradient(0,0,5,0,0,38);aura.addColorStop(0,p.side<0?'#71f5ff55':'#ffe36e55');aura.addColorStop(1,'#72dfff00');x.fillStyle=aura;x.beginPath();x.arc(0,0,38,0,Math.PI*2);x.fill();
 x.globalAlpha=.7;x.strokeStyle=p.side<0?'#70f5ff':'#ffe36e';x.lineWidth=2;x.beginPath();x.ellipse(0,0,27,24+Math.sin(t*.012)*2,0,0,Math.PI*2);x.stroke();x.globalAlpha=1;
 // backpack
 x.fillStyle='#174b83';x.strokeStyle='#75eaff';x.lineWidth=2;round(-23,-5,12,22,5);x.fillStyle='#51eaff';x.shadowColor='#51eaff';x.shadowBlur=9;x.fillRect(-20,0,5,11);x.shadowBlur=0;
 // little suit body
 let suit=x.createLinearGradient(-12,4,12,25);suit.addColorStop(0,'#ffffff');suit.addColorStop(.55,'#d8efff');suit.addColorStop(1,'#397bc4');x.fillStyle=suit;x.strokeStyle='#3b8ed0';x.lineWidth=1.5;x.beginPath();x.ellipse(0,13,13,14,0,0,Math.PI*2);x.fill();x.stroke();
 // arms and boots
 x.fillStyle='#eaf7ff';x.strokeStyle='#4289c9';x.lineWidth=2;x.beginPath();x.ellipse(-12,11,6,9,-.5,0,Math.PI*2);x.fill();x.stroke();x.beginPath();x.ellipse(12,11,6,9,.5,0,Math.PI*2);x.fill();x.stroke();
 x.fillStyle='#173d72';round(-10,22,9,7,3);round(3,22,9,7,3);x.fillStyle='#ffb34b';x.fillRect(-9,26,8,2);x.fillRect(4,26,8,2);
 // large round helmet/head
 let hg=x.createRadialGradient(-8,-17,2,0,-8,25);hg.addColorStop(0,'#ffffff');hg.addColorStop(.72,'#f2f7ff');hg.addColorStop(1,'#a9c9ed');x.fillStyle=hg;x.strokeStyle='#3d79b6';x.lineWidth=2.2;x.shadowColor='#7bdfff';x.shadowBlur=11;x.beginPath();x.arc(0,-9,21,0,Math.PI*2);x.fill();x.stroke();x.shadowBlur=0;
 // blue visor cap
 x.fillStyle='#1461a8';x.beginPath();x.ellipse(0,-23,19,8,-.08,Math.PI,Math.PI*2);x.fill();x.fillStyle='#42d9ff';x.beginPath();x.ellipse(1,-25,13,4,-.08,Math.PI,Math.PI*2);x.fill();
 // side headphones
 x.fillStyle='#ffb43d';x.strokeStyle='#174d86';x.lineWidth=2;x.beginPath();x.arc(-20,-10,7,0,Math.PI*2);x.fill();x.stroke();x.fillStyle='#35d9ff';x.beginPath();x.arc(-20,-10,4,0,Math.PI*2);x.fill();x.fillStyle='#ffdc65';x.font='bold 8px sans-serif';x.textAlign='center';x.fillText('ϟ',-20,-7);
 // face, cheeks, eyes and happy smile
 x.fillStyle='#26334b';x.beginPath();x.ellipse(-7,-10,3.5,5,0,0,Math.PI*2);x.ellipse(7,-10,3.5,5,0,0,Math.PI*2);x.fill();x.fillStyle='white';x.beginPath();x.arc(-8,-12,1.3,0,Math.PI*2);x.arc(6,-12,1.3,0,Math.PI*2);x.fill();x.fillStyle='#ff9ca4';x.beginPath();x.ellipse(-13,-3,4,2.4,0,0,Math.PI*2);x.ellipse(13,-3,4,2.4,0,0,Math.PI*2);x.fill();x.strokeStyle='#b84e62';x.lineWidth=1.8;x.beginPath();x.arc(0,-2,4,0.15,Math.PI-.15);x.stroke();
 // lightning badge on chest
 x.fillStyle='#ffcf4f';x.strokeStyle='#d77d26';x.lineWidth=1;x.beginPath();x.roundRect(-5,8,10,10,3);x.fill();x.stroke();x.fillStyle='#fff';x.font='bold 9px sans-serif';x.fillText('ϟ',0,16);
 x.restore();
}
function update(dt){let a=cfg[diff];frame+=dt;comboClock=Math.max(0,comboClock-dt);if(comboClock===0){combo=0;$('combo').style.opacity=0}speed=Math.min(a.v*1.65,a.v+score*.016);if(frame>a.spawn-(speed-a.v)*3){spawn();frame=0}p.vy+=a.grav*p.side*dt;p.y+=p.vy*dt;p.rot+=(Math.max(-.35,Math.min(.35,p.vy*.045))-p.rot)*.15*dt;if(p.y-p.r<6||p.y+p.r>H-6){end();return}
for(let o of obs){o.x-=speed*dt;if(!o.passed&&o.x+o.w<p.x){o.passed=true;combo++;comboClock=105;score+=combo>=3?2:1;$('score').textContent=score;if(combo>=2){$('combo').textContent='COMBO ×'+combo;$('combo').style.opacity=1}beep(600+Math.min(combo,5)*70,.06)}if(hitRect(p.x,p.y,p.r,o.x,0,o.w,o.top)||hitRect(p.x,p.y,p.r,o.x,o.bottom,o.w,H-o.bottom)){end();return}}
for(let q of coins){q.x-=speed*dt;q.spin+=.1*dt;if(!q.t&&Math.hypot(p.x-q.x,p.y-q.y)<p.r+10){q.t=true;score+=3;$('score').textContent=score;beep(950,.1);for(let i=0;i<12;i++)bits.push({x:q.x,y:q.y,vx:(Math.random()-.5)*6,vy:(Math.random()-.5)*6,l:26})}}obs=obs.filter(o=>o.x+o.w>-20);coins=coins.filter(q=>q.x>-20&&!q.t);for(let b of bits){b.x+=b.vx*dt;b.y+=b.vy*dt;b.l-=dt}bits=bits.filter(b=>b.l>0)}
function loop(t){let dt=Math.min(2,(t-last)/16.67||1);last=t;if(mode==='play'){update(dt);if(p&&Math.random()<.75)bits.push({x:p.x-13,y:p.y+4,vx:-1.2-Math.random()*1.4,vy:(Math.random()-.5)*1.8,l:13})}draw(t);requestAnimationFrame(loop)}
panel('NÉ GẤP!','Gặp <b>BÉ TIA</b> ⚡ — người hùng phi hành gia tí hon!<br>Chạm một lần để đảo trọng lực, né cổng và gom sao!','CHƠI NGAY',start);reset();requestAnimationFrame(loop);
})();
</script></body></html>
