<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#090f25">
<title>NÉ GẤP! 0.2 — 3D Arcade</title>
<style>
:root{--gold:#ffe36e;--cyan:#64f4e2;--ink:#0b1228}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:white;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none;user-select:none}
canvas{display:block;width:100vw;height:100dvh}
#hud{position:fixed;inset:0;pointer-events:none;padding:calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 12px)}
.top{display:flex;justify-content:space-between;align-items:flex-start}
.brand{font-size:12px;font-weight:1000;letter-spacing:2px;color:#b9d4ff;text-shadow:0 2px 8px #000}
.scorebox{text-align:center;position:absolute;left:50%;transform:translateX(-50%);top:calc(env(safe-area-inset-top) + 8px)}
#score{font-size:clamp(42px,11vw,62px);font-weight:1000;line-height:1;text-shadow:0 4px 0 #0007,0 0 22px #67eaff55}
#best{font-size:11px;letter-spacing:1.5px;color:#c5d4f1;font-weight:800}
.tools{display:flex;gap:8px;pointer-events:auto}
.tool{width:42px;height:42px;border-radius:14px;border:1px solid #ffffff35;background:#142344cc;color:white;font-size:18px}
#progress{position:absolute;top:calc(env(safe-area-inset-top) + 88px);left:18px;right:18px;height:5px;border-radius:9px;background:#ffffff20;overflow:hidden}
#bar{height:100%;width:0;background:linear-gradient(90deg,#66f2e3,#ffe36e);border-radius:9px}
#panel{pointer-events:auto;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,380px);padding:26px 23px 22px;border-radius:28px;text-align:center;border:1px solid #b6d9ff55;background:linear-gradient(145deg,#1c3159f5,#10182ff5);box-shadow:0 25px 80px #0009, inset 0 1px #ffffff25}
#logo{font-size:clamp(39px,11vw,53px);font-weight:1000;letter-spacing:-3px;line-height:1;color:var(--gold);text-shadow:0 4px 0 #9b682b,0 8px 20px #0008}
#tag{font-size:10px;letter-spacing:4px;font-weight:900;color:#9cf9ed;margin:8px 0 15px}
#desc{font-size:14px;line-height:1.55;color:#d9e6ff;margin:0 0 19px}
#mainBtn{width:100%;border:0;border-radius:16px;padding:16px;background:linear-gradient(180deg,#fff08d,#ffc94f);color:#1b2340;font-size:17px;font-weight:1000;box-shadow:0 5px 0 #b77b29}
#mainBtn:active{transform:translateY(3px);box-shadow:0 2px 0 #b77b29}
.note{font-size:11px;color:#a8b9d9;margin-top:15px;line-height:1.5}
.hidden{display:none!important}
#toast{position:absolute;top:26%;left:50%;transform:translateX(-50%);font-size:14px;font-weight:1000;letter-spacing:2px;color:#fff5a7;text-shadow:0 3px 12px #000;opacity:0;transition:opacity .2s}
#hint{position:absolute;bottom:calc(env(safe-area-inset-bottom) + 20px);left:0;right:0;text-align:center;font-size:11px;letter-spacing:1.5px;color:#d6e6ff9c;text-shadow:0 2px 8px #000}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="hud">
 <div class="top"><div class="brand">NE GAP!<br><span style="opacity:.55;font-size:9px">ARCADE 0.2</span></div><div class="tools"><button class="tool" id="soundBtn" aria-label="Âm thanh">♫</button><button class="tool" id="pauseBtn" aria-label="Tạm dừng">Ⅱ</button></div></div>
 <div class="scorebox"><div id="score">0</div><div id="best">BEST 0</div></div>
 <div id="progress"><div id="bar"></div></div>
 <div id="toast">NÉ SIÊU ĐẸP!</div>
 <div id="panel"><div id="logo">NÉ GẤP!</div><div id="tag">DODGE • FLIP • SURVIVE</div><p id="desc">Chạm để đảo trọng lực.<br>Né cổng năng lượng, gom xu và lập kỷ lục mới!</p><button id="mainBtn">CHƠI NGAY</button><div class="note">Một ngón tay là đủ.<br>Đừng chớp mắt nhé!</div></div>
 <div id="hint">CHẠM MÀN HÌNH ĐỂ ĐẢO TRỌNG LỰC</div>
</div>
<script>
(()=>{
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
let W=innerWidth,H=innerHeight,D=1,mode='ready',score=0,best=+(localStorage.neGapBest02||0),coins=0,frame=0,speed=3.5,player=null,obstacles=[],pickups=[],particles=[],stars=[],last=0,muted=false,audio=null,shake=0,combo=0,comboTimer=0,shield=0;
$('best').textContent='BEST '+best;
function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*D;canvas.height=H*D;ctx.setTransform(D,0,0,D,0,0);makeStars();if(player){player.x=W*.25;}}
addEventListener('resize',resize);
function makeStars(){stars=Array.from({length:48},()=>({x:Math.random()*W,y:Math.random()*H*.75,z:.3+Math.random()*.8,r:.5+Math.random()*1.5}));}
resize();
function audioOn(){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();}catch(e){}}
function tone(freq,dur,type='sine',vol=.045,slide=0){if(muted)return;audioOn();if(!audio)return;let o=audio.createOscillator(),g=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(40,freq+slide),audio.currentTime+dur);g.gain.setValueAtTime(vol,audio.currentTime);g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+dur);o.connect(g);g.connect(audio.destination);o.start();o.stop(audio.currentTime+dur);}
function sfx(kind){if(kind==='flip'){tone(420,.09,'sine',.035,360)}if(kind==='coin'){tone(880,.08,'triangle',.05,420);setTimeout(()=>tone(1320,.1,'triangle',.035,120),55)}if(kind==='hit'){tone(180,.28,'sawtooth',.06,-110)}if(kind==='combo'){tone(650,.13,'triangle',.045,500)}if(kind==='shield'){tone(300,.18,'sine',.04,700)}}
$('soundBtn').onclick=()=>{muted=!muted;$('soundBtn').textContent=muted?'♫̸':'♫';if(!muted){audioOn();tone(600,.08)}};
$('pauseBtn').onclick=()=>{if(mode==='play'){mode='pause';showPanel('TẠM DỪNG','Bạn nghỉ một nhịp nhé.<br>Kỷ lục hiện tại: '+best,'TIẾP TỤC',resume)}else if(mode==='pause')resume();};
function showPanel(title,desc,button,fn){$('logo').textContent=title;$('tag').textContent='NÉ GẤP! • ARCADE 0.2';$('desc').innerHTML=desc;$('mainBtn').textContent=button;$('mainBtn').onclick=fn;$('panel').classList.remove('hidden');}
function hidePanel(){$('panel').classList.add('hidden')}
function reset(){score=0;coins=0;frame=0;speed=3.5;combo=0;comboTimer=0;shield=0;shake=0;obstacles=[];pickups=[];particles=[];player={x:W*.25,y:H*.75,r:17,side:1,vy:0,rot:0,blink:0};$('score').textContent='0';$('bar').style.width='0%';}
function start(){audioOn();reset();mode='play';hidePanel();$('pauseBtn').textContent='Ⅱ';$('pauseBtn').style.opacity='1';$('mainBtn').onclick=start;}
function resume(){mode='play';hidePanel();$('pauseBtn').textContent='Ⅱ';}
$('mainBtn').onclick=start;
function flip(){if(mode!=='play')return;player.side*=-1;player.vy=player.side*5.2;player.blink=10;burst(player.x,player.y,'#ffe36e',9);sfx('flip');}
canvas.addEventListener('pointerdown',e=>{e.preventDefault();if(mode==='play')flip();});
addEventListener('keydown',e=>{if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();if(mode==='ready'||mode==='over')start();else if(mode==='play')flip();else if(mode==='pause')resume();}});
function burst(x,y,color,n){for(let i=0;i<n;i++){let a=Math.random()*Math.PI*2,v=1+Math.random()*4;particles.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:20+Math.random()*18,max:38,color,size:2+Math.random()*4});}}
function spawn(){let gap=Math.max(125,H*.25-(speed-3)*5),center=H*.5+(Math.random()-.5)*H*.25;let type=Math.random();obstacles.push({x:W+45,w:type<.3?28:34,top:center-gap/2,bottom:center+gap/2,passed:false,phase:Math.random()*6.28});if(Math.random()<.85)pickups.push({x:W+75,y:center+(Math.random()-.5)*gap*.38,r:10,taken:false,kind:Math.random()<.13?'shield':'coin',spin:0});}
function circleRect(cx,cy,r,x,y,w,h){let px=Math.max(x,Math.min(cx,x+w)),py=Math.max(y,Math.min(cy,y+h));return (cx-px)**2+(cy-py)**2<r*r;}
function finish(){if(mode!=='play')return;mode='over';sfx('hit');shake=18;burst(player.x,player.y,'#ff687d',24);if(score>best){best=score;localStorage.neGapBest02=best;}$('best').textContent='BEST '+best;showPanel('GAME OVER','Bạn đạt <b>'+score+'</b> điểm và nhặt được <b>'+coins+'</b> xu.<br>'+(score===best?'🏆 KỶ LỤC MỚI!':'Cố thêm một lần nữa nhé!'),'CHƠI LẠI',start);}
function rounded(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,Math.max(0,h),r);ctx.fill();}
function drawBackground(t){let g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#101e43');g.addColorStop(.58,'#182b4d');g.addColorStop(1,'#090f25');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
for(let s of stars){let x=(s.x-t*.12*s.z+W*2)%(W+20);ctx.fillStyle=`rgba(190,225,255,${.25*s.z})`;ctx.beginPath();ctx.arc(x,s.y,s.r,0,6.28);ctx.fill();}
let horizon=H*.53;ctx.fillStyle='#263d68';ctx.beginPath();ctx.moveTo(0,horizon);ctx.lineTo(W,horizon);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
ctx.strokeStyle='#5478a7';ctx.globalAlpha=.25;ctx.lineWidth=1;
for(let i=-5;i<=5;i++){ctx.beginPath();ctx.moveTo(W/2+i*3,horizon);ctx.lineTo(W/2+i*W*.18,H);ctx.stroke();}
for(let j=1;j<9;j++){let p=j/9, y=horizon+(H-horizon)*p*p;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
ctx.globalAlpha=1;ctx.fillStyle='#5cf1df';ctx.globalAlpha=.75;ctx.fillRect(0,horizon,W,2);ctx.globalAlpha=1;
ctx.fillStyle='#0a1530';ctx.fillRect(0,0,W,5);ctx.fillRect(0,H-5,W,5);
}
function drawGate(o,t){let pulse=.5+.5*Math.sin(t*.006+o.phase);let x=o.x,w=o.w,topH=o.top,bottomY=o.bottom;
ctx.save();ctx.shadowColor='#58f3d0';ctx.shadowBlur=15;
let grad=ctx.createLinearGradient(x,0,x+w,0);grad.addColorStop(0,'#168d91');grad.addColorStop(.45,'#8affdf');grad.addColorStop(1,'#176d9a');ctx.fillStyle=grad;
rounded(x,0,w,topH,7);rounded(x,bottomY,w,H-bottomY,7);
ctx.fillStyle='#d4fff3';ctx.globalAlpha=.5+pulse*.4;ctx.fillRect(x+5,0,3,topH);ctx.fillRect(x+5,bottomY,3,H-bottomY);
ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.fillStyle='#0a536d';ctx.fillRect(x-3,topH-7,w+6,7);ctx.fillRect(x-3,bottomY,w+6,7);ctx.restore();}
function drawCoin(c){ctx.save();ctx.translate(c.x,c.y);ctx.rotate(Math.sin(c.spin)*.25);let scale=.65+.35*Math.abs(Math.cos(c.spin));ctx.scale(scale,1);let g=ctx.createLinearGradient(-9,-10,9,10);g.addColorStop(0,'#fff7a1');g.addColorStop(.5,'#ffc43d');g.addColorStop(1,'#b96d1d');ctx.fillStyle=g;ctx.shadowColor='#ffd64d';ctx.shadowBlur=14;ctx.beginPath();ctx.arc(0,0,c.r,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.strokeStyle='#fff2a3';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#a96820';ctx.font='bold 12px sans-serif';ctx.textAlign='center';ctx.fillText(c.kind==='shield'?'✦':'$',0,4);ctx.restore();}
function drawHero(){let p=player;ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
ctx.fillStyle='#0007';ctx.beginPath();ctx.ellipse(0,p.side===1?28:-28,19,6,0,0,Math.PI*2);ctx.fill();
if(shield>0){ctx.strokeStyle='#7ff9ff';ctx.lineWidth=3;ctx.shadowColor='#7ff9ff';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(0,0,26+Math.sin(frame*.2)*2,0,Math.PI*2);ctx.stroke();ctx.shadowBlur=0;}
let body=ctx.createRadialGradient(-7,-9,2,2,3,23);body.addColorStop(0,'#fff8bf');body.addColorStop(.35,'#ffdf69');body.addColorStop(.78,'#f5a936');body.addColorStop(1,'#a9532c');
ctx.fillStyle=body;ctx.shadowColor='#ffca54';ctx.shadowBlur=18;ctx.beginPath();ctx.arc(0,0,18,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;
ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(7,-5,5,7,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#14213e';ctx.beginPath();ctx.arc(9,-4,2.5,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#ff8c5b';ctx.beginPath();ctx.moveTo(13,1);ctx.lineTo(25,5);ctx.lineTo(13,8);ctx.fill();
ctx.fillStyle='#fff2c2';ctx.beginPath();ctx.arc(-7,-11,4,0,Math.PI*2);ctx.fill();
ctx.fillStyle='#e87937';ctx.beginPath();ctx.ellipse(-4,17,6,3,0,0,Math.PI*2);ctx.fill();
ctx.restore();}
function draw(){let t=performance.now();ctx.save();if(shake>0){ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);shake*=.85;}drawBackground(t);
for(let o of obstacles)drawGate(o,t);for(let c of pickups)if(!c.taken)drawCoin(c);
for(let p of particles){ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle=p.color;ctx.shadowColor=p.color;ctx.shadowBlur=8;ctx.beginPath();ctx.arc(p.x,p.y,p.size,0,6.28);ctx.fill();ctx.shadowBlur=0;}ctx.globalAlpha=1;
if(player)drawHero();ctx.restore();}
function update(dt){if(mode!=='play')return;frame+=dt;speed=Math.min(8,3.5+score*.028);comboTimer=Math.max(0,comboTimer-dt);if(comboTimer===0)combo=0;
if(frame>Math.max(47,92-speed*4.7)){spawn();frame=0;}
player.vy+=player.side*.34*dt;player.y+=player.vy*dt;player.rot=Math.max(-.42,Math.min(.42,player.vy*.055));player.blink=Math.max(0,player.blink-dt);
if(player.y-player.r<7||player.y+player.r>H-7){if(shield>0){shield=0;player.y=player.side===1?H-35:35;player.vy=0;sfx('shield');burst(player.x,player.y,'#7ff9ff',18);}else{finish();return;}}
for(let o of obstacles){o.x-=speed*dt;if(!o.passed&&o.x+o.w<player.x){o.passed=true;score++;combo++;comboTimer=95;if(combo>=3){score+=2;sfx('combo');toast('COMBO x'+combo);}else tone(520,.045,'sine',.012);$('score').textContent=score;}}
for(let o of obstacles){if(circleRect(player.x,player.y,player.r,o.x,0,o.w,o.top)||circleRect(player.x,player.y,player.r,o.x,o.bottom,o.w,H-o.bottom)){if(shield>0){shield=0;o.x=-100;burst(player.x,player.y,'#7ff9ff',22);sfx('shield');toast('KHIÊN CỨU MẠNG!');}else{finish();return;}}}
for(let c of pickups){c.x-=speed*dt;c.spin+=.12*dt;if(!c.taken&&Math.hypot(player.x-c.x,player.y-c.y)<player.r+c.r+2){c.taken=true;if(c.kind==='shield'){shield=1;sfx('shield');toast('KHIÊN BẢO VỆ!');burst(c.x,c.y,'#7ff9ff',14);}else{coins++;score+=3;$('score').textContent=score;sfx('coin');burst(c.x,c.y,'#ffe36e',12);}}}
obstacles=obstacles.filter(o=>o.x+o.w>-30);pickups=pickups.filter(c=>c.x>-30&&!c.taken);
for(let p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.035*dt;p.life-=dt;}particles=particles.filter(p=>p.life>0);
$('bar').style.width=(score%25)/25*100+'%';
}
let toastTimer=0;function toast(s){$('toast').textContent=s;$('toast').style.opacity=1;toastTimer=55;}
function loop(t){let dt=Math.min(2.2,(t-last)/16.67||1);last=t;if(mode==='play')update(dt);if(toastTimer>0){toastTimer-=dt;if(toastTimer<=0)$('toast').style.opacity=0;}draw();requestAnimationFrame(loop);}
reset();showPanel('NÉ GẤP!','Chạm để đảo trọng lực.<br>Né cổng năng lượng, gom xu và lập kỷ lục mới!','CHƠI NGAY',start);requestAnimationFrame(loop);
})();
</script>
</body>
</html>
